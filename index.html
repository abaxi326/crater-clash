<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <meta name="description" content="Crater Clash: a turn-based artillery duel across destructible, collapsing worlds." />
    <title>Crater Clash</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='22' fill='%23ff7448'/%3E%3Ccircle cx='32' cy='34' r='12' fill='%23ffd28a'/%3E%3Ccircle cx='32' cy='34' r='5' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preload" href="/fonts/outfit-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html, body { margin: 0; height: 100%; background: #07090f; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; overflow: hidden; }
      #stage, #hud, #overlay { position: absolute; inset: 0; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #hud, #overlay { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="hud"></div>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
