<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sandbox · postfx</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; color: #cfd6e4; font: 12px/1.3 system-ui, sans-serif; overflow: hidden; }
      #root { position: absolute; inset: 0; display: grid; gap: 4px; padding: 4px; box-sizing: border-box; }
      #root.full { padding: 0; gap: 0; }
      .cell { position: relative; overflow: hidden; background: #000; min-width: 0; min-height: 0; }
      .cell canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .cell span { position: absolute; left: 8px; top: 6px; padding: 2px 7px; border-radius: 4px; background: rgba(0,0,0,.55); color: #fff; font-weight: 600; letter-spacing: .02em; z-index: 1; }
      #info { position: fixed; right: 8px; bottom: 6px; background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 4px; z-index: 2; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="info"></div>
    <script type="module" src="./postfx.ts"></script>
  </body>
</html>
