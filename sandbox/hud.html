<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sandbox · HUD</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07090f; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; overflow: hidden; }
      #stage, #hud, #overlay { position: absolute; inset: 0; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #hud, #overlay { pointer-events: none; }
      #dev { position: fixed; left: 8px; bottom: 8px; z-index: 99; display: none; flex-wrap: wrap; gap: 4px; max-width: 360px;
        font: 11px system-ui; background: rgba(0,0,0,.6); padding: 6px; border-radius: 8px; }
      #dev.on { display: flex; }
      #dev button { font: inherit; color: #fff; background: #334; border: 0; border-radius: 4px; padding: 4px 6px; cursor: pointer; }
      #log { position: fixed; right: 8px; bottom: 8px; z-index: 99; font: 11px ui-monospace, monospace; color: #9fe; background: rgba(0,0,0,.55);
        padding: 4px 8px; border-radius: 6px; display: none; white-space: pre; }
      #log.on { display: block; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="hud"></div>
      <div id="overlay"></div>
    </div>
    <div id="dev"></div>
    <div id="log"></div>
    <script type="module" src="./hud.ts"></script>
  </body>
</html>
