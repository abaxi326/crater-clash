<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sandbox · audio gallery</title>
    <style>
      html, body { margin: 0; background: #0b1020; color: #dfe6f3; font: 12px system-ui; }
      h1 { font: 600 16px system-ui; margin: 12px 16px 4px; }
      p { margin: 0 16px 8px; color: #8a96ad; }
      #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 8px 16px 16px; }
      figure { margin: 0; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden; }
      figcaption { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 11px; }
      figcaption b { font-weight: 600; }
      figcaption span { color: #8a96ad; font-variant-numeric: tabular-nums; }
      figcaption span.hot { color: #ff6b6b; }
      canvas { display: block; width: 100%; }
    </style>
  </head>
  <body>
    <h1>Audio gallery: offline renders (waveform + log-frequency spectrogram)</h1>
    <p id="info">rendering…</p>
    <div id="grid"></div>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
