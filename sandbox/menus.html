<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sandbox · menus</title>
    <link rel="stylesheet" href="/src/ui/base.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #07090f; overflow: hidden; }
      body { -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; overflow: hidden; }
      #stage, #hud, #overlay { position: absolute; inset: 0; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #hud, #overlay { pointer-events: none; }
      #log { position: fixed; left: 6px; bottom: 6px; z-index: 99; font: 11px/1.3 monospace; color: #9fe; opacity: .7; pointer-events: none; white-space: pre; }
      .sb-bar { position: fixed; right: 6px; top: 6px; z-index: 99; display: flex; gap: 4px; flex-wrap: wrap; max-width: 60vw; justify-content: flex-end; }
      .sb-bar button { font: 11px system-ui; background: #0008; color: #ccc; border: 1px solid #fff3; border-radius: 4px; padding: 2px 6px; }
      body.shot .sb-bar, body.shot #log { display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"><canvas id="bg"></canvas></div>
      <div id="hud"></div>
      <div id="overlay"></div>
    </div>
    <div class="sb-bar" id="bar"></div>
    <div id="log"></div>
    <script type="module" src="./menus.ts"></script>
  </body>
</html>
